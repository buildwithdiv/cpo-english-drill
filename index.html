<html lang="en">
<head>

<title>CPO English Drill — by Div</title>

<meta name="author" content="Div" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --navy:#121D2E; --navy2:#1B2A40; --navy3:#23374F;
    --brass:#C9972E; --brassDim:#8A6B26; --olive:#6E7F53;
    --ink:#EFE9DA; --inkDim:#B9C2CE; --green:#4C8A56; --red:#BD4433; --border:#33465F;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter',sans-serif; background:var(--navy); color:var(--ink);
    min-height:100vh;
    background-image: repeating-linear-gradient(0deg, rgba(201,151,46,0.06) 0px, rgba(201,151,46,0.06) 1px, transparent 1px, transparent 3px);
  }
  .display{ font-family:'Oswald',sans-serif; letter-spacing:0.02em; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  ::selection{ background:#C9972E; color:#16233A; }

  .wrap{ max-width: 880px; margin:0 auto; padding: 0 20px; }
  .wrap-sm{ max-width: 720px; margin:0 auto; padding: 0 20px; }

  a, button { font-family: inherit; }
  button{ cursor:pointer; }
  button:active{ transform: scale(0.98); }
  button:disabled{ cursor:default; }
  .card{ transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }

  .fade{ animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .spinner{ display:inline-block; width:16px; height:16px; border:2px solid rgba(239,233,218,0.25); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite; }
  @media (prefers-reduced-motion: reduce){ .card:hover{transform:none;} .fade{animation:none;} .spinner{animation:none;} }

  .badge{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:4px; letter-spacing:.06em; text-transform:uppercase;
    display:inline-block; color:var(--brass); background:rgba(201,151,46,0.14); border:1px solid rgba(201,151,46,0.35);
  }

  header.appbar{ border-bottom:1px solid var(--border); background:var(--navy2); }

  .brand{ display:flex; align-items:center; gap:12px; background:none; border:none; }
  .brand-badge{ width:38px; height:38px; border-radius:8px; background:var(--brass); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .brand-title{ font-size:18px; font-weight:600; color:var(--ink); line-height:1; text-align:left; }
  .brand-sub{ font-size:10px; color:var(--inkDim); letter-spacing:.08em; margin-top:3px; text-align:left; }

  .hero{ background:var(--navy2); border:1px solid var(--border); border-radius:12px; padding:28px 26px; margin: 24px 0 22px; }
  .hero-flex{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hero h1{ font-size:28px; font-weight:600; margin:10px 0 8px; color:var(--ink); }
  .hero p{ color:var(--inkDim); font-size:14px; max-width:560px; line-height:1.6; margin:0; }
  .hero-stats{ text-align:right; flex-shrink:0; }

  .cta-mixed{
    width:100%; text-align:left; background:linear-gradient(120deg,var(--brassDim),var(--brass));

  .ai-section{

  .opt-list{ display:flex; flex-direction:column; gap:10px; }

  .explain-box{ margin-top:16px; background:var(--navy3); border:1px solid var(--border); border-radius:10px; padding:14px 18px; }
  .explain-label{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--olive); margin-bottom:6px; letter-spacing:.08em; }
  .explain-text{ font-size:13.5px; color:var(--inkDim); line-height:1.6; margin:0; }

  .btn-primary{
    margin-top:18px; width:100%; background:var(--brass); border:none; border-radius:8px; padding:13px;
    font-size:14px; font-weight:700; color:var(--navy); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary:disabled{ opacity:0.55; }
  .btn-secondary{
    background:none; border:1px solid var(--border); border-radius:8px; padding:12px 22px; font-size:14px; font-weight:600; color:var(--ink);
  }

  .summary-wrap{ text-align:center; padding: 56px 0; }
  .summary-icon{ width:64px; height:64px; border-radius:50%; background:rgba(201,151,46,0.14); border:1px solid var(--brass); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:28px; }
  .summary-pct{ font-family:'JetBrains Mono',monospace; font-size:50px; font-weight:700; color:var(--brass); margin-top:14px; }
  .summary-frac{ font-size:14px; color:var(--inkDim); margin-bottom:8px; }
  .summary-verdict{ font-size:14.5px; color:var(--ink); margin-bottom:30px; }
  .summary-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  .level-row{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .level-chip{ padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:transparent; color:var(--inkDim); }
  .level-chip.active{ border-color:var(--brass); background:rgba(201,151,46,0.14); color:var(--brass); }

  .word-card{ background:var(--navy2); border:1px solid var(--border); border-radius:12px; padding:26px; margin-bottom:16px; }
  .word-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .word-title{ font-family:'Oswald',sans-serif; font-size:32px; font-weight:600; color:var(--ink); margin-bottom:14px; }
  .word-block{ margin-bottom:14px; }
  .word-block .lab{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; margin-bottom:4px; }
  .word-block .val{ font-size:14.5px; color:var(--ink); line-height:1.6; }
  .word-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:14px; }
  .word-ex{ border-top:1px solid var(--border); padding-top:14px; font-size:13.5px; color:var(--ink); font-style:italic; line-height:1.6; }
  .src-tag{ font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 8px; border-radius:999px; }

  .quiz-actions{ display:flex; gap:12px; }
  .quiz-actions button{ flex:1; padding:13px; border-radius:8px; font-size:14px; font-weight:700; }

  .loading-box{ text-align:center; padding:60px 0; color:var(--inkDim); font-size:14px; }

  table.score-table{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.score-table th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--inkDim); letter-spacing:.06em; padding:8px 10px; border-bottom:1px solid var(--border); }
  table.score-table td{ padding:11px 10px; font-size:13px; border-bottom:1px solid var(--border); color:var(--ink); }
  .accbar-outer{ height:5px; width:70px; background:var(--navy3); border-radius:999px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; }
  .accbar-inner{ height:100%; border-radius:999px; }
  .focus-box{ background:rgba(189,68,51,0.10); border:1px solid rgba(189,68,51,0.4); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .strong-box{ background:rgba(76,138,86,0.10); border:1px solid rgba(76,138,86,0.4); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .focus-box .lab{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--red); letter-spacing:.06em; margin-bottom:8px; }
  .strong-box .lab{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--green); letter-spacing:.06em; margin-bottom:8px; }
  .focus-item, .strong-item{ font-size:13.5px; color:var(--ink); margin-bottom:4px; }

  footer.appfooter{ border-top:1px solid var(--border); margin-top:50px; padding:22px 20px 40px; text-align:center; }
  footer.appfooter .love{ font-family:'Oswald',sans-serif; font-size:13px; color:var(--inkDim); letter-spacing:.04em; }
  footer.appfooter .love b{ color:var(--brass); }
  footer.appfooter .tag{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--inkDim); opacity:0.6; margin-top:6px; }

  @media (max-width:600px){
    .hero h1{ font-size:22px; }
    .word-title{ font-size:26px; }
    .word-grid{ grid-template-columns:1fr; }
  }
</style>
</head>

<header class="appbar">
  <div class="appbar-inner">
    <button class="brand" onclick="goHome()">
      <div class="brand-badge">🛡️</div>
      <div>
        <div class="brand-title">CPO ENGLISH DRILL</div>
        <div class="brand-sub">TIER-2 · SI TRAINING GROUND</div>
      </div>
    </button>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="badge" id="headerWordCount">🔥 0 words drilled</span>

    </div>
  </div>
</header>

<div id="app"></div>

<footer class="appfooter">
  <div class="love">Made with ❤️ by <b>Div</b></div>
  <div class="tag">CPO English Drill — built for aspirants preparing for SSC CPO Tier-2</div>
</footer>

<script>
/* =========================================================================
   DATA — question banks (SSC CPO Paper-2 / Tier-2 pattern)
   ========================================================================= */

const TOPICS = [
  { id: "errorSpotting", post: "01", name: "Error Spotting", icon: "🎯", brief: "Grammar & usage errors" },
  { id: "cloze", post: "02", name: "Cloze Test", icon: "🧩", brief: "Contextual fill-ups" },
  { id: "synAnt", post: "03", name: "Synonym / Antonym", icon: "🔁", brief: "Word meaning & opposites" },
  { id: "idioms", post: "04", name: "Idioms & Phrases", icon: "💬", brief: "Figurative usage" },
  { id: "oneWord", post: "05", name: "One-Word Substitution", icon: "✍️", brief: "Single word for a phrase" },
  { id: "sentenceImp", post: "06", name: "Sentence Improvement", icon: "✅", brief: "Correction & rephrasing" },
  { id: "paraJumble", post: "07", name: "Para Jumbles", icon: "🔢", brief: "Logical sentence order" },
  { id: "voice", post: "08", name: "Active / Passive Voice", icon: "🔃", brief: "Voice conversion" },
  { id: "narration", post: "09", name: "Direct / Indirect Speech", icon: "🗣️", brief: "Narration change" },
  { id: "spelling", post: "10", name: "Spelling Check", icon: "🔤", brief: "Correctly spelt word" },
  { id: "rc", post: "11", name: "Reading Comprehension", icon: "📖", brief: "Passage-based questions" },
];

const Q = {
  errorSpotting: [
    { q: "There is a spectrum / of seas around that / land which attracts / tourists of all aging.", opts: ["There is a spectrum", "of seas around that", "land which attracts", "tourists of all aging"], a: 3, exp: "'Aging' → 'ages'. The idiom is 'tourists of all ages'." },
    { q: "Anant was telling a story about his recent exploits / when a tree branch / break the living room / window suddenly.", opts: ["Anant was telling a story about his recent exploits", "when a tree branch", "break the living room", "window suddenly"], a: 2, exp: "Sentence is in past tense, so 'break' → 'broke'." },
    { q: "Neither of the two / candidates were ready / to accept the / new policy.", opts: ["Neither of the two", "candidates were ready", "to accept the", "new policy"], a: 1, exp: "'Neither...nor' takes a singular verb → 'was ready'." },
    { q: "She don't like / to travel alone / at night in / unfamiliar cities.", opts: ["She don't like", "to travel alone", "at night in", "unfamiliar cities"], a: 0, exp: "Third person singular subject 'She' needs 'doesn't'." },
    { q: "Each of the officers / have submitted their / reports before the / deadline yesterday.", opts: ["Each of the officers", "have submitted their", "reports before the", "deadline yesterday"], a: 1, exp: "'Each' is singular → 'has submitted'." },
    { q: "The number of / accidents on this / highway are increasing / every single year.", opts: ["The number of", "accidents on this", "highway are increasing", "every single year"], a: 2, exp: "'The number of' takes a singular verb → 'is increasing'." },
    { q: "One of my / friend are joining / the police academy / next month.", opts: ["One of my", "friend are joining", "the police academy", "next month"], a: 1, exp: "'One of my friends' + singular verb → 'friend is joining' (also 'friends')." },
    { q: "He is one / of the best / officer that has / ever served here.", opts: ["He is one", "of the best", "officer that has", "ever served here"], a: 2, exp: "'One of the best' is followed by a plural noun → 'officers'." },
    { q: "Scarcely had the / train left when / did the passenger / realise his mistake.", opts: ["Scarcely had the", "train left when", "did the passenger", "realise his mistake"], a: 2, exp: "'Scarcely...when' should not have inversion again → 'the passenger realised'." },
    { q: "Not only he / was late but / also he forgot / his identity card.", opts: ["Not only he", "was late but", "also he forgot", "his identity card"], a: 0, exp: "Correct inversion: 'Not only was he late'." },
    { q: "The police, along with / the fire brigade, / were present at / the accident spot.", opts: ["The police, along with", "the fire brigade,", "were present at", "the accident spot"], a: 2, exp: "'Along with' does not add to the subject; the verb agrees with 'police' → 'was present'." },
    { q: "If I was you, / I would report / the matter to / the authorities immediately.", opts: ["If I was you,", "I would report", "the matter to", "the authorities immediately"], a: 0, exp: "Unreal conditional needs subjunctive → 'If I were you'." },
    { q: "The manager insisted that / all the employees should / attends the meeting / without any excuse.", opts: ["The manager insisted that", "all the employees should", "attends the meeting", "without any excuse."], a: 2, exp: "Subjunctive after 'insisted that...should' needs the base form → 'attend'." },
    { q: "By the time the police arrive / the culprits had already / fled from the / scene of crime.", opts: ["By the time the police arrive", "the culprits had already", "fled from the", "scene of crime."], a: 0, exp: "Sequence of tenses with past perfect requires simple past → 'arrived'." },
    { q: "Everybody in the office / were surprised to / hear about his / sudden resignation.", opts: ["Everybody in the office", "were surprised to", "hear about his", "sudden resignation."], a: 1, exp: "'Everybody' is singular → 'was surprised'." },
    { q: "She along with her colleagues / were awarded for / their excellent performance / in the annual review.", opts: ["She along with her colleagues", "were awarded for", "their excellent performance", "in the annual review."], a: 1, exp: "'Along with' does not pluralise the subject 'She' → 'was awarded'." },
    { q: "It is high time / we took strict action / against those who / breaks the law.", opts: ["It is high time", "we took strict action", "against those who", "breaks the law."], a: 3, exp: "The relative clause subject 'who' refers to plural 'those' → 'break'." },
    { q: "Between you and I, / this plan seems / far too risky / to attempt now.", opts: ["Between you and I,", "this plan seems", "far too risky", "to attempt now."], a: 0, exp: "'Between' is a preposition and takes the object form → 'you and me'." },
  ],
  cloze: [
    { q: "The constable acted with great ___ during the rescue operation.", opts: ["bravery", "brave", "bravest", "braved"], a: 0, exp: "A noun is needed after 'great' → 'bravery'." },
    { q: "Despite ___ warnings, the crowd did not disperse.", opts: ["repeat", "repeated", "repeating", "repetition"], a: 1, exp: "An adjective is needed before 'warnings' → 'repeated'." },
    { q: "The investigation was carried out ___ strict confidentiality.", opts: ["with", "in", "under", "by"], a: 2, exp: "Standard collocation: 'carried out under strict confidentiality'." },
    { q: "He was held ___ questioning for six hours at the station.", opts: ["for", "in", "on", "at"], a: 0, exp: "'Held for questioning' is the correct collocation." },
    { q: "The new recruits will have to ___ a rigorous training schedule.", opts: ["undergo", "undertake", "undermine", "underline"], a: 0, exp: "'Undergo training' is the standard usage." },

/* difficulty heuristic: first third of a bank = Easy, middle third = Medium, last third = Hard.
   This is a simple proxy (question banks are hand-ordered roughly by complexity already);
   it powers the adaptive ordering below. */
function tagDifficulty(arr) {
  const n = arr.length;
  return arr.map((q, i) => {
    const d = i < n / 3 ? "Easy" : i < (2 * n) / 3 ? "Medium" : "Hard";
    return Object.assign({}, q, { d: d });
  });
}

function flattenRC() {
  const out = [];
  Q.rc.forEach((block, bi) => {
    block.qs.forEach((item, qi) => {
      out.push(Object.assign({}, item, { passage: block.passage, _key: "rc-" + bi + "-" + qi }));
    });
  });
  return out;
}

/* =========================================================================
   PROCEDURAL GENERATORS — combinatorial engines, no AI needed.
   These don't rely on a fixed list of pre-written questions: they build a
   fresh, grammatically-correct question (with freshly randomised wrong
   options) on every call, from a bank of building blocks. Because every
   generated question gets a unique random key, the no-repeat session engine
   below always treats them as "never seen before", so Voice / Synonym-Antonym
   / One-Word / Idioms practice effectively never runs out or feels repetitive
   — even without an internet connection or an AI key.
   ========================================================================= */

function capFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---- Active/Passive Voice generator: 15 subjects x 15 objects x 20 verbs
   x 6 tenses = 27,000+ distinct correct sentences, each with 3 systematic
   "wrong tense" / "reversed agent" distractors built the way real exam
   distractors are — never hand-written, always assembled on the fly. ---- */
const GEN_SUBJECTS = ["the officer", "the inspector", "the constable", "the investigating team", "the committee", "the witness", "the department", "the magistrate", "the forensic expert", "the head constable", "the senior officer", "the patrol team", "the commissioner", "the review board", "the training academy"];
const GEN_OBJECTS = ["the suspect", "the case", "the report", "the evidence", "the culprit", "the complaint", "the vehicle", "the documents", "the crime scene", "the accused", "the investigation", "the arrest warrant", "the verdict", "the request", "the application"];
const GEN_VERBS = [
  { base: "arrest", past: "arrested", pp: "arrested", ing: "arresting", third: "arrests" },
  { base: "submit", past: "submitted", pp: "submitted", ing: "submitting", third: "submits" },
  { base: "investigate", past: "investigated", pp: "investigated", ing: "investigating", third: "investigates" },
  { base: "complete", past: "completed", pp: "completed", ing: "completing", third: "completes" },
  { base: "review", past: "reviewed", pp: "reviewed", ing: "reviewing", third: "reviews" },
  { base: "examine", past: "examined", pp: "examined", ing: "examining", third: "examines" },

  { base: "keep", past: "kept", pp: "kept", ing: "keeping", third: "keeps" },
];
const GEN_TENSE_AUX = { simplePast: "was", simplePresent: "is", presentContinuous: "is being", presentPerfect: "has been", simpleFuture: "will be", modalMust: "must be" };
const GEN_ACTIVE_BUILD = {
  simplePast: function (s, o, v) { return capFirst(s) + " " + v.past + " " + o + "."; },
  simplePresent: function (s, o, v) { return capFirst(s) + " " + v.third + " " + o + "."; },
  presentContinuous: function (s, o, v) { return capFirst(s) + " is " + v.ing + " " + o + "."; },
  presentPerfect: function (s, o, v) { return capFirst(s) + " has " + v.pp + " " + o + "."; },
  simpleFuture: function (s, o, v) { return capFirst(s) + " will " + v.base + " " + o + "."; },
  modalMust: function (s, o, v) { return capFirst(s) + " must " + v.base + " " + o + "."; },
};
const GEN_DIFF_BY_TENSE = { simplePast: "Easy", simplePresent: "Easy", presentPerfect: "Medium", simpleFuture: "Medium", modalMust: "Medium", presentContinuous: "Hard" };

function generateVoiceQuestion() {
  const tenseKeys = Object.keys(GEN_TENSE_AUX);
  const tense = randPick(tenseKeys);
  const s = randPick(GEN_SUBJECTS);
  const o = randPick(GEN_OBJECTS);
  const v = randPick(GEN_VERBS);
  const activeSentence = GEN_ACTIVE_BUILD[tense](s, o, v);
  const correct = capFirst(o) + " " + GEN_TENSE_AUX[tense] + " " + v.pp + " by " + s + ".";
  const otherTenses = shuffle(tenseKeys.filter(function (t) { return t !== tense; })).slice(0, 2);
  const d1 = capFirst(o) + " " + GEN_TENSE_AUX[otherTenses[0]] + " " + v.pp + " by " + s + ".";
  const d2 = capFirst(o) + " " + GEN_TENSE_AUX[otherTenses[1]] + " " + v.pp + " by " + s + ".";
  const d3 = capFirst(s) + " " + GEN_TENSE_AUX[tense] + " " + v.pp + " by " + o + ".";
  const opts = shuffle([correct, d1, d2, d3]);
  return {
    q: "Change to Passive: '" + activeSentence + "'",
    opts: opts, a: opts.indexOf(correct),
    exp: "Correct passive form: '" + GEN_TENSE_AUX[tense] + " + " + v.pp + "', with the object promoted to subject and 'by' introducing the original doer.",
    d: GEN_DIFF_BY_TENSE[tense] || "Medium",
    _key: "genvoice-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
  };
}
function generateVoiceBatch(n) {
  const out = [], seen = {};
  let guard = 0;
  while (out.length < n && guard < n * 20) {
    guard++;
    const q = generateVoiceQuestion();
    if (seen[q.q]) continue;
    seen[q.q] = true;
    out.push(q);
  }
  return out;
}

function generateIdiomQuestion() {
  const entry = randPick(IDIOMS_BANK);
  let pool = IDIOMS_BANK.filter(function (e) { return e.idiom !== entry.idiom; }).map(function (e) { return e.meaning; });
  pool = shuffle(pool).slice(0, 3);
  const opts = shuffle([entry.meaning].concat(pool));
  return {
    q: "'" + capFirst(entry.idiom) + "' means:",
    opts: opts, a: opts.indexOf(entry.meaning),
    exp: "It means " + entry.meaning.charAt(0).toLowerCase() + entry.meaning.slice(1) + ".",
    d: "Medium",
    _key: "genidiom-" + entry.idiom + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
  };
}
function generateIdiomBatch(n) {
  const out = [], seen = {};
  let guard = 0;
  while (out.length < n && guard < n * 20) {
    guard++;
    const q = generateIdiomQuestion();
    if (seen[q.q]) continue;
    seen[q.q] = true;
    out.push(q);
  }
  return out;
}

function getBank(topicId) {
  if (topicId === "rc") return tagDifficulty(flattenRC());
  const GEN_SIZE = 40;
  if (topicId === "voice") {
    const curated = tagDifficulty(Q.voice.map(function (item, i) { return Object.assign({}, item, { _key: "voice-" + i }); }));
    return curated.concat(generateVoiceBatch(GEN_SIZE));
  }
  if (topicId === "synAnt") {
    const curated = tagDifficulty(Q.synAnt.map(function (item, i) { return Object.assign({}, item, { _key: "synAnt-" + i }); }));
    return curated.concat(generateSynAntBatch(GEN_SIZE));
  }
  if (topicId === "oneWord") {
    const curated = tagDifficulty(Q.oneWord.map(function (item, i) { return Object.assign({}, item, { _key: "oneWord-" + i }); }));
    return curated.concat(generateOneWordBatch(GEN_SIZE));
  }
  if (topicId === "idioms") {
    const curated = tagDifficulty(Q.idioms.map(function (item, i) { return Object.assign({}, item, { _key: "idioms-" + i }); }));
    return curated.concat(generateIdiomBatch(GEN_SIZE));
  }
  return tagDifficulty(Q[topicId].map(function (item, i) { return Object.assign({}, item, { _key: topicId + "-" + i }); }));
}
function getMixedBank() {
  let all = [];
  TOPICS.forEach(t => { all = all.concat(getBank(t.id).map(q => Object.assign({}, q, { _topic: t.id }))); });
  return shuffle(all);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ---- adaptive ordering: sorts a shuffled bank so difficulty matches the
   user's tracked capability in that topic (Testbook-style adaptive drilling) ---- */
function computeCapability(topicKey) {
  const s = state.stats[topicKey];
  if (!s || s.attempts < 3) return "Beginner";
  const acc = (s.correct / s.attempts) * 100;
  if (acc >= 75) return "Advanced";
  if (acc >= 50) return "Intermediate";
  return "Beginner";
}
function orderByCapability(bank, cap) {
  const order = cap === "Advanced" ? ["Hard", "Medium", "Easy"]
              : cap === "Intermediate" ? ["Medium", "Hard", "Easy"]
              : ["Easy", "Medium", "Hard"];
  const groups = { Easy: [], Medium: [], Hard: [] };
  bank.forEach(function (q) { groups[q.d || "Medium"].push(q); });
  let out = [];
  order.forEach(function (lvl) { out = out.concat(shuffle(groups[lvl])); });
  return out;
}
function overallCapability() {
  let attempts = 0, correct = 0;
  TOPICS.forEach(t => { const s = state.stats[t.id]; if (s) { attempts += s.attempts; correct += s.correct; } });
  if (attempts < 6) return "Beginner";
  const acc = (correct / attempts) * 100;
  if (acc >= 75) return "Advanced";
  if (acc >= 50) return "Intermediate";
  return "Beginner";
}

/* ---- no-repeat session engine ----
   Testbook avoids repeats by drawing from a huge question bank split into
   chapter-wise sets. Our bank is much smaller, so instead we track how many
   times (and how recently) each question has been served, and every new
   session prioritises completely unseen questions first, then the
   least-recently-seen ones — so back-to-back attempts don't show the same
   set, and content only starts repeating once everything has been covered. */
function pickSessionPool(fullBank, size) {
  const log = state.seenLog;
  let scored = fullBank.map(function (q) {
    const rec = log[q._key] || { count: 0, last: 0 };
    return { q: q, count: rec.count, last: rec.last, rnd: Math.random() };
  });
  scored.sort(function (a, b) {
    if (a.count !== b.count) return a.count - b.count;
    if (a.last !== b.last) return a.last - b.last;
    return a.rnd - b.rnd;
  });
  return scored.slice(0, Math.min(size, scored.length)).map(function (x) { return x.q; });
}
function markSeen(key) {
  if (key.indexOf("gen") === 0 || key.indexOf("ai-") === 0) return; // always-unique keys — nothing useful to track
  const rec = state.seenLog[key] || { count: 0, last: 0 };
  state.seenLog[key] = { count: rec.count + 1, last: Date.now() };
  saveJSON("cpo-seen-log", state.seenLog);
}

async function fetchDefinition(word) {
  const res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word));
  if (!res.ok) return null;
  const json = await res.json();
  const entry = json[0];
  if (!entry || !entry.meanings || !entry.meanings.length) return null;
  const meaningBlock = entry.meanings[0];
  const def = meaningBlock.definitions && meaningBlock.definitions[0];
  if (!def || !def.definition) return null;

  let syn = (def.synonyms && def.synonyms.length) ? def.synonyms.slice(0, 3).join(", ") : null;
  let ant = (def.antonyms && def.antonyms.length) ? def.antonyms.slice(0, 3).join(", ") : null;
  if (!syn || !ant) {
    try {
      const [synRes, antRes] = await Promise.all([
        fetch("https://api.datamuse.com/words?rel_syn=" + encodeURIComponent(word) + "&max=3").then(r => r.ok ? r.json() : []),
        fetch("https://api.datamuse.com/words?rel_ant=" + encodeURIComponent(word) + "&max=3").then(r => r.ok ? r.json() : []),
      ]);
      if (!syn) syn = synRes.map(x => x.word).join(", ") || "—";
      if (!ant) ant = antRes.map(x => x.word).join(", ") || "—";
    } catch (e) { if (!syn) syn = "—"; if (!ant) ant = "—"; }
  }

  const meaning = def.definition.charAt(0).toUpperCase() + def.definition.slice(1);
  const example = def.example ? def.example.charAt(0).toUpperCase() + def.example.slice(1) : null;

  return {
    w: word.charAt(0).toUpperCase() + word.slice(1),
    meaning: meaning,
    syn: syn, ant: ant,
    ex: example || ("Officers are expected to act with " + word + " in the line of duty."),
    level: levelFromWord(word),
    source: "live",
  };
}

/* Pull a fresh, unseen, exam-relevant word from the internet. Returns null on any failure
   so the caller can fall back to the offline bank. */
async function fetchLiveWord(desiredLevel, seenWords) {
  const seeds = shuffle(VOCAB_SEEDS.slice());
  for (let s = 0; s < seeds.length; s++) {
    try {
      const res = await fetch("https://api.datamuse.com/words?ml=" + encodeURIComponent(seeds[s]) + "&max=60");
      if (!res.ok) continue;
      const list = await res.json();
      let candidates = list.map(x => x.word).filter(function (w) { return /^[a-zA-Z]+$/.test(w); });
      if (desiredLevel !== "Mixed") {
        candidates = candidates.filter(function (w) { return levelFromWord(w) === desiredLevel; });
      } else {
        candidates = candidates.filter(function (w) { return w.length >= 4 && w.length <= 13; });
      }
      candidates = shuffle(candidates);
      for (let c = 0; c < Math.min(candidates.length, 8); c++) {
        const word = candidates[c].toLowerCase();
        if (seenWords.indexOf(word) !== -1) continue;
        const data = await fetchDefinition(word);
        if (data) return data;
      }
    } catch (e) { continue; }
  }
  return null;
}

  document.getElementById("headerWordCount").textContent = "🔥 " + state.wordsLearned + " words drilled";
}

/* =========================================================================
   ACTIONS — practice
   ========================================================================= */
function goHome() { state.screen = "home"; state.activeTopic = null; render(); }

async function startPractice(topicId) {
  state.activeTopic = topicId;
  state.idx = 0;
  state.selected = null;
  state.revealed = false;
  state.correctCount = 0;

  if (state.aiKey && topicId !== "mixed") {
    state.screen = "aigenerating";
    render();
    try {
      const aiQs = await generateAIQuestions(topicId, 10);
      state.bank = orderByCapability(aiQs, computeCapability(topicId));
      state.screen = "practice";
      render();
      return;
    } catch (e) {
      state.aiJustFailed = true; // shown once on the practice screen
    }
  }

  const fullBank = topicId === "mixed" ? getMixedBank() : getBank(topicId);
  const sessionSize = topicId === "mixed" ? Math.min(30, fullBank.length) : Math.min(12, fullBank.length);
  const pool = pickSessionPool(fullBank, sessionSize);
  const cap = topicId === "mixed" ? overallCapability() : computeCapability(topicId);
  state.bank = orderByCapability(pool, cap);
  state.screen = "practice";
  render();
}

function chooseOption(i) {
  if (state.revealed) return;
  const q = state.bank[state.idx];
  state.selected = i;
  state.revealed = true;
  if (i === q.a) state.correctCount++;
  markSeen(q._key);
  render();
}

function nextQuestion() {
  if (state.idx + 1 < state.bank.length) {
    state.idx++; state.selected = null; state.revealed = false; render();
  } else {
    const key = state.activeTopic;
    const prev = state.stats[key] || { attempts: 0, correct: 0, best: 0 };
    const pct = Math.round((state.correctCount / state.bank.length) * 100);
    state.stats[key] = {
      attempts: prev.attempts + state.bank.length,
      correct: prev.correct + state.correctCount,
      best: Math.max(prev.best, pct),
    };
    saveJSON("cpo-stats", state.stats);
    state.screen = "summary";
    render();
  }
}

/* =========================================================================
   ACTIONS — vocab (word of the day, internet powered)
   ========================================================================= */
async function openVocab() {
  state.screen = "vocab";
  render();
  if (!state.vocabWord) await nextWord();
}

function setVocabLevel(l) {
  state.vocabLevel = l;
  nextWord();
}

function rememberLearned(wordObj) {
  const exists = state.vocabLearned.some(function (v) { return v.w.toLowerCase() === wordObj.w.toLowerCase(); });
  if (!exists) {
    state.vocabLearned.push(wordObj);
    if (state.vocabLearned.length > 150) state.vocabLearned.shift();
    saveJSON("cpo-vocab-learned", state.vocabLearned);
  }
  const lw = wordObj.w.toLowerCase();
  if (state.vocabSeenWords.indexOf(lw) === -1) {
    state.vocabSeenWords.push(lw);
    if (state.vocabSeenWords.length > 400) state.vocabSeenWords.shift();
    saveJSON("cpo-vocab-seen-words", state.vocabSeenWords);
  }
}

async function nextWord() {
  state.vocabLoading = true;
  render();

  let word = null;
  try {
    word = await fetchLiveWord(state.vocabLevel, state.vocabSeenWords);
  } catch (e) { word = null; }

  if (!word) {
    // offline / fetch failed → fallback bank
    const pool = state.vocabLevel === "Mixed" ? FALLBACK_VOCAB : FALLBACK_VOCAB.filter(function (v) { return v.level === state.vocabLevel; });
    let unseen = pool.filter(function (v) { return state.vocabSeenWords.indexOf(v.w.toLowerCase()) === -1; });
    if (unseen.length === 0) unseen = pool;
    const pick = unseen[Math.floor(Math.random() * unseen.length)];
    word = Object.assign({}, pick, { source: "offline" });
  }

  state.vocabWord = word;
  state.vocabLoading = false;
  rememberLearned(word);
  state.wordsLearned++;
  saveJSON("cpo-words-learned", state.wordsLearned);
  badgeCount();
  render();
}

/* =========================================================================
   ACTIONS — vocab test (separate quiz mode, testbook-style)
   ========================================================================= */
function openVocabTest() {
  const pool = state.vocabLearned;
  if (pool.length < 4) { state.screen = "vocab"; render(); return; }
  const size = Math.min(8, pool.length);
  state.vqPool = shuffle(pool).slice(0, size);
  state.vqIdx = 0;
  state.vqCorrect = 0;
  state.vqAnswered = null;
  buildVqOptions();
  state.screen = "vocabtest";
  render();
}

function buildVqOptions() {
  const correctWord = state.vqPool[state.vqIdx];
  const distractPool = FALLBACK_VOCAB.concat(state.vocabLearned).filter(function (v) { return v.w.toLowerCase() !== correctWord.w.toLowerCase(); });
  const distractors = shuffle(distractPool).slice(0, 3).map(function (v) { return v.meaning; });
  state.vqOpts = shuffle([correctWord.meaning].concat(distractors));
  state.vqAnswered = null;
}

function answerVq(i) {
  if (state.vqAnswered) return;
  const correctWord = state.vqPool[state.vqIdx];
  const isCorrect = state.vqOpts[i] === correctWord.meaning;
  state.vqAnswered = isCorrect ? "correct" : "wrong";
  if (isCorrect) state.vqCorrect++;
  render();
}

function nextVq() {
  if (state.vqIdx + 1 < state.vqPool.length) {
    state.vqIdx++;
    buildVqOptions();
    render();
  } else {
    const prev = state.stats["vocab"] || { attempts: 0, correct: 0, best: 0 };
    const pct = Math.round((state.vqCorrect / state.vqPool.length) * 100);
    state.stats["vocab"] = {
      attempts: prev.attempts + state.vqPool.length,
      correct: prev.correct + state.vqCorrect,
      best: Math.max(prev.best, pct),
    };
    saveJSON("cpo-stats", state.stats);
    state.screen = "vocabtestsummary";
    render();
  }
}

  if (state.vqAnswered) {
    nextHtml = '<button class="btn-primary" onclick="nextVq()">' + (state.vqIdx + 1 < state.vqPool.length ? "Next Word" : "Finish Test") + ' →</button>';
  }

  return '' +
  '<div class="wrap-sm fade">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0 16px;">' +
      '<button class="backbtn" onclick="goHome()">← Duty Board</button>' +
      '<span class="badge">VOCAB TEST</span>' +
    '</div>' +
    '<div class="progress-outer"><div class="progress-inner" style="width:' + pct + '%;"></div></div>' +
    '<div class="progress-meta"><span>Word ' + (state.vqIdx + 1) + ' / ' + state.vqPool.length + '</span><span>Score: ' + state.vqCorrect + '</span></div>' +
    '<div class="question-box"><p class="question-text">Which meaning matches — <b style="color:var(--brass);">' + esc(w.w) + '</b>?</p></div>' +
    '<div class="opt-list">' + optsHtml + '</div>' +
    nextHtml +
    '<div style="height:40px;"></div>' +
  '</div>';
}

function renderVocabTestSummary() {
  const total = state.vqPool.length;
  const pct = Math.round((state.vqCorrect / total) * 100);
  let verdict = "Revisit these words — repetition is what makes them stick.";
  if (pct >= 85) verdict = "Strong vocabulary — you're ready at SI level!";
  else if (pct >= 65) verdict = "Good work — a bit more revision will lock these in.";
  else if (pct >= 45) verdict = "Good start — visit the Vocabulary Builder daily to build on this.";

  return '' +
  '<div class="wrap-sm fade">' +
    '<div class="summary-wrap">' +
      '<div class="summary-icon">📚</div>' +
      '<span class="badge">Vocab Test — Complete</span>' +
      '<div class="summary-pct">' + pct + '%</div>' +
      '<div class="summary-frac">' + state.vqCorrect + ' / ' + total + ' correct</div>' +
      '<p class="summary-verdict">' + verdict + '</p>' +
      '<div class="summary-actions">' +
        '<button class="btn-primary" style="margin:0;width:auto;padding:12px 22px;" onclick="openVocabTest()">↺ Retry Test</button>' +
        '<button class="btn-secondary" onclick="openVocab()">More Words</button>' +
        '<button class="btn-secondary" onclick="goHome()">Duty Board</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderScorecard() {
  const rows = TOPICS.map(function (t) { return { id: t.id, name: t.name, icon: t.icon }; });
  rows.push({ id: "vocab", name: "Vocabulary (Word Tests)", icon: "📚" });

  let anyData = false;
  const withAcc = rows.map(function (r) {
    const s = state.stats[r.id];
    const acc = s ? Math.round((s.correct / s.attempts) * 100) : null;
    if (s) anyData = true;
    return Object.assign({}, r, { s: s, acc: acc });
  });

  if (!anyData) {
    return '<div class="wrap-sm fade">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0 20px;"><button class="backbtn" onclick="goHome()">← Duty Board</button><span class="badge">Scorecard</span></div>' +
      '<div class="loading-box">No practice completed yet.<br/>Finish a few drills first, and your progress report will appear here.</div>' +
      '</div>';
  }

  const attempted = withAcc.filter(function (r) { return r.s && r.s.attempts >= 3; });
  const weakest = attempted.slice().sort(function (a, b) { return a.acc - b.acc; }).slice(0, 3).filter(function(r){ return r.acc < 70; });
  const strongest = attempted.slice().sort(function (a, b) { return b.acc - a.acc; }).slice(0, 2).filter(function(r){ return r.acc >= 70; });

  let focusHtml = "";
  if (weakest.length) {
    focusHtml = '<div class="focus-box"><div class="lab">⚠ FOCUS AREAS — prioritise these first</div>' +
      weakest.map(function (r) { return '<div class="focus-item">' + r.icon + ' <b>' + esc(r.name) + '</b> — ' + r.acc + '% accuracy</div>'; }).join("") +
      '</div>';
  }
  let strongHtml = "";
  if (strongest.length) {
    strongHtml = '<div class="strong-box"><div class="lab">✓ STRONG AREAS — you are already exam-ready here</div>' +
      strongest.map(function (r) { return '<div class="strong-item">' + r.icon + ' <b>' + esc(r.name) + '</b> — ' + r.acc + '% accuracy</div>'; }).join("") +
      '</div>';
  }

  const tableRows = withAcc.map(function (r) {
    if (!r.s) return '<tr><td>' + r.icon + ' ' + esc(r.name) + '</td><td colspan="3" style="color:var(--inkDim);">Not attempted yet</td></tr>';
    const acc = r.acc;
    const barColor = acc >= 70 ? "var(--green)" : acc >= 45 ? "var(--brass)" : "var(--red)";
    const cap = r.id === "vocab" ? "" : computeCapability(r.id);
    return '<tr>' +
      '<td>' + r.icon + ' ' + esc(r.name) + (cap ? ' <span class="cap-chip" style="color:' + (cap === "Advanced" ? "var(--green)" : cap === "Intermediate" ? "var(--brass)" : "var(--inkDim)") + ';background:transparent;">' + cap + '</span>' : '') + '</td>' +
      '<td>' + r.s.attempts + ' Qs</td>' +
      '<td><span class="accbar-outer"><span class="accbar-inner" style="width:' + acc + '%;background:' + barColor + ';"></span></span>' + acc + '%</td>' +
      '<td>' + r.s.best + '% best</td>' +
      '</tr>';
  }).join("");

  return '' +
  '<div class="wrap fade">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0 20px;">' +
      '<button class="backbtn" onclick="goHome()">← Duty Board</button>' +
      '<span class="badge">Scorecard</span>' +
    '</div>' +
    '<h1 class="display" style="font-size:24px;margin:0 0 16px;">Progress Report</h1>' +
    focusHtml + strongHtml +
    '<div style="overflow-x:auto;">' +
    '<table class="score-table"><thead><tr><th>Section</th><th>Attempted</th><th>Accuracy</th><th>Best</th></tr></thead><tbody>' + tableRows + '</tbody></table>' +
    '</div>' +
    '<div style="height:30px;"></div>' +
  '</div>';
}

/* boot */
render();
</script>
</body>
</html>
